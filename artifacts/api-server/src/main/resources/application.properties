spring.application.name=auth-api
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Replace JWT_SECRET in production with a base64-encoded key of at least 256 bits.
app.jwt.secret=${JWT_SECRET:UmVwbGl0QXV0aEFQSV9kZXZlbG9wbWVudF9zZWNyZXRfa2V5XzMyX2J5dGVzX2xvbmc=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Set SEED_ADMIN_ENABLED=true and provide SEED_ADMIN_PASSWORD to create a test admin.
app.seed-admin.enabled=${SEED_ADMIN_ENABLED:false}
app.seed-admin.email=${SEED_ADMIN_EMAIL:admin@example.com}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:}

logging.level.com.replit.authapi=INFO